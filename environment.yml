# Electrolyte project Conda environment
# Create:  conda env create -f environment.yml
# Activate: conda activate electrolyte
# GPU PyTorch (optional, after activating the environment):
#   pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cu124

name: electrolyte
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.23
  - pandas>=1.5
  - scipy
  - scikit-learn>=1.2
  - matplotlib>=3.6
  - seaborn>=0.12
  - pyyaml>=6
  - tensorboard>=2.12
  - rdkit
  - pip:
    - torch>=2.0.0
    - torchvision>=0.15.0
